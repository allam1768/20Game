<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyberTop" x1="18" y1="3" x2="18" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="cyberLeft" x1="5" y1="10.5" x2="18" y2="33" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="cyberRight" x1="31" y1="10.5" x2="18" y2="33" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="cyberCore" x1="18" y1="11" x2="18" y2="23" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="neonGlow" x="0" y="0" width="36" height="36" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#38BDF8" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#neonGlow)">
    <!-- Top Face -->
    <polygon points="18,4 30.5,11.2 18,18.4 5.5,11.2" fill="url(#cyberTop)" />
    <!-- Left Face -->
    <polygon points="5.5,11.2 18,18.4 18,32.8 5.5,25.6" fill="url(#cyberLeft)" />
    <!-- Right Face -->
    <polygon points="18,18.4 30.5,11.2 30.5,25.6 18,32.8" fill="url(#cyberRight)" />
    <!-- Outer Contour -->
    <polygon points="18,4 30.5,11.2 30.5,25.6 18,32.8 5.5,25.6 5.5,11.2" stroke="#38BDF8" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- Internal Creases -->
    <line x1="5.5" y1="11.2" x2="18" y2="18.4" stroke="#7DD3FC" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="30.5" y1="11.2" x2="18" y2="18.4" stroke="#60A5FA" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="18" y1="18.4" x2="18" y2="32.8" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Central Dimensional Prism Core -->
    <polygon points="18,12 23,17 18,22 13,17" fill="url(#cyberCore)" stroke="#FFFFFF" stroke-width="0.8" />
    <polyline points="13,17 18,18.4 23,17" stroke="#0284C7" stroke-width="0.7"/>
    <line x1="18" y1="12" x2="18" y2="22" stroke="#0284C7" stroke-width="0.7"/>
  </g>
</svg>